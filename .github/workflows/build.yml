# The shared build: gitleaks on the repo, a build-args check, build the
# Containerfile, the contract test, Trivy scan, and on a tag push
# ghcr.io/<owner>/<app>:<tag>. With `promote: true` it also moves the channel
# tags: :prod after the owner approves, :staging on a push to `staging`, each
# with verify-and-revert (ADR-006, Phase B).
# Apps call it from a short CI file; see README.md. Changing it: AGENTS.md.
name: build

on:
  workflow_call:
    inputs:
      app:
        description: Image name under ghcr.io/<owner>. Default the repo name, lowercased.
        type: string
        default: ""
      context:
        description: Build context, relative to the repo root.
        type: string
        default: .
      containerfile:
        description: Path to the Containerfile, relative to the context.
        type: string
        default: Containerfile
      build-args:
        description: One KEY=VALUE per line. Never secrets; a secret-shaped name or value fails the build.
        type: string
        default: ""
      trivy-ignore:
        description: Trivy ignore file, relative to the repo root. One CVE ID per line, with a comment saying why.
        type: string
        default: .trivyignore
      app-json:
        description: Sample /run/secrets/app.json for the contract test, relative to the context. Fake values only; it is committed. Default an empty object.
        type: string
        default: ""
      health-path:
        description: The path the contract test and uptime checks call. It must answer 2xx with the build version.
        type: string
        default: /healthz
      memory:
        description: Memory limit for the contract test, as in production (--memory). Set it to the app's measured peak plus 25 to 50 percent.
        type: string
        default: 512m
      contract-exec:
        description: "More modes of the same image to contract-test, one per line as `<exec> | <health>`: the command to run instead of the image's CMD, and the health command to run inside the container. Both are split on spaces and run with no shell, like infra's exec and health_cmd. A mode passes when the health command exits 0 and prints the build version within 60 s. Empty tests only the default CMD and health-path."
        type: string
        default: ""
      promote:
        description: "Move the channel tags: :prod on a version tag (after the `production` Environment approves) and on a workflow_dispatch with a version, :staging on a push to the staging branch. The caller needs the Environment first."
        type: boolean
        default: false
      production-url:
        description: The app's public health URL, such as https://app.doublew.nu/healthz. After :prod moves, the job polls it for the new version. Empty skips the check, for an app with no port.
        type: string
        default: ""
      staging-url:
        description: The same for the app's staging slot, such as https://staging1.doublew.nu/healthz. Empty skips the check.
        type: string
        default: ""
      verify-window:
        description: "Seconds to poll after a move: about 2 host-timer intervals plus start-up time. Default 900 rounds up 2 x (300 s interval + 30 s delay) + 120 s. The first half (450 s) is the start-up allowance, one interval plus delay plus 120 s of start-up: failures count only after it, or once the new version has shown."
        type: string
        default: "900"
      verify-failures:
        description: How many polls in a row must fail before the tag is moved back. A shorter blip is ignored.
        type: string
        default: "3"
    secrets:
      CF_ACCESS_CLIENT_ID:
        description: Client ID of a read-only Cloudflare Access service token, for a health URL behind Access. Optional.
        required: false
      CF_ACCESS_CLIENT_SECRET:
        description: Client secret of the same token. Optional.
        required: false
    outputs:
      image:
        description: The image reference built, ghcr.io/<owner>/<app>:<version>.
        value: ${{ jobs.plan.outputs.image }}
      digest:
        description: The pushed digest (sha256:...). Empty when nothing was pushed.
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  # Decides what this run does, so a re-promote can skip the build.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      app: ${{ steps.vars.outputs.app }}
      repo: ${{ steps.vars.outputs.repo }}
      image: ${{ steps.vars.outputs.image }}
      version: ${{ steps.vars.outputs.version }}
      publish: ${{ steps.vars.outputs.publish }}
      build: ${{ steps.vars.outputs.build }}
      channel: ${{ steps.vars.outputs.channel }}
    steps:
      # Tested by tests/test_version.py, which runs this exact script.
      - name: Compute image name, version and channel
        id: vars
        env:
          APP: ${{ inputs.app }}
          PROMOTE: ${{ inputs.promote }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          # The caller's workflow_dispatch input; github.event is the caller's event.
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          app="${APP:-$REPO_NAME}"
          repo="ghcr.io/${OWNER,,}/${app,,}"
          vre='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          build=true publish=false channel=""
          if [ "${EVENT_NAME:-}" = workflow_dispatch ] && [ "$PROMOTE" = true ]; then
            # Re-promote an earlier release: no build, the same approval. Without
            # promote, a manual run is a plain build, as it was before this input.
            if [[ ! "${DISPATCH_VERSION:-}" =~ $vre ]]; then
              echo "::error::the version input must be a published version such as v1.4.0."; exit 1
            fi
            version="$DISPATCH_VERSION" build=false channel=production
          elif [ "$REF_TYPE" = tag ]; then
            # Only vX.Y.Z (optionally -prerelease) publishes. Tags such as prod and
            # staging are moved by the promote job and must never be pushed here.
            if [[ ! "$REF_NAME" =~ $vre ]]; then
              echo "::error::tag ${REF_NAME:0:60} is not a version such as v1.4.0. Only version tags publish."; exit 1
            fi
            version="$REF_NAME" publish=true
            [ "$PROMOTE" = true ] && channel=production
          else
            version="sha-${SHA:0:12}"
            # A push to staging publishes this build, then the promote job moves :staging to it.
            if [ "$PROMOTE" = true ] && [ "${EVENT_NAME:-}" = push ] && [ "$REF_NAME" = staging ]; then
              publish=true channel=staging
            fi
          fi
          image="$repo:${version}"
          echo "Image: $image (publish: $publish, channel: ${channel:-none})"
          {
            echo "app=${app,,}"; echo "repo=$repo"; echo "image=$image"; echo "version=$version"
            echo "publish=$publish"; echo "build=$build"; echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      # Keep the gitleaks pin equal to tools/check-image/Containerfile.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks and Trivy, verified by sha256
        run: |
          bin="$RUNNER_TEMP/bin" && mkdir -p "$bin" && cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" gitleaks.tgz "$TRIVY_SHA256" trivy.tgz | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$bin" gitleaks
          tar -xzf trivy.tgz -C "$bin" trivy
          echo "$bin" >> "$GITHUB_PATH"

      # Tested by tests/test_build_args.py, which runs this exact script.
      - name: Refuse secret-shaped build arguments
        id: build-args
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          # Our config only: a .gitleaks.toml, .gitleaksignore or gitleaks:allow
          # comment in the caller's repo must not silence a finding.
          gl="$(mktemp -d)" && mkdir "$gl/no-ignore"
          printf '[extend]\nuseDefault = true\n' > "$gl/config.toml"
          fail=0
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "${line//[[:space:]]/}" ] && continue
            if [[ "$line" != *=* ]]; then
              echo "::error::build-args line is not KEY=VALUE: ${line:0:40}"; fail=1; continue
            fi
            name="${line%%=*}"; upper="${name^^}"; segs="_${upper//-/_}_"
            if [[ "$upper" =~ SECRET|TOKEN|PASSWORD|PASSWD|CREDENTIAL|APIKEY|PRIVATE ]] \
              || [[ "$segs" =~ _(KEY|PASS|PWD|AUTH|CERT|COOKIE|SALT|DSN|SESSION)S?_ ]]; then
              echo "::error::build-args name $name looks secret. Pass secrets at run time, never at build time."; fail=1
            fi
          done <<< "$BUILD_ARGS"
          if [ -n "$BUILD_ARGS" ] && ! printf '%s\n' "$BUILD_ARGS" | gitleaks stdin --no-banner --redact --log-level error \
              --config "$gl/config.toml" --gitleaks-ignore-path "$gl/no-ignore" --ignore-gitleaks-allow; then
            echo "::error::gitleaks found a secret-shaped value in build-args."; fail=1
          fi
          exit "$fail"

      - name: Scan the repo history for secrets
        id: history
        # Every commit reachable from HEAD (what is built), not other branches.
        # Our config only, as in the build-args step. gitleaks always reads a
        # .gitleaksignore at the root it scans, so scan the git dir, not the tree.
        run: |
          gl="$(mktemp -d)" && mkdir "$gl/no-ignore"
          printf '[extend]\nuseDefault = true\n' > "$gl/config.toml"
          gitleaks git --no-banner --redact --log-opts="--full-history HEAD" \
            --config "$gl/config.toml" --gitleaks-ignore-path "$gl/no-ignore" --ignore-gitleaks-allow \
            "$(git rev-parse --absolute-git-dir)"

      - name: Build the image
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          VERSION: ${{ needs.plan.outputs.version }}
          CONTEXT: ${{ inputs.context }}
          CONTAINERFILE: ${{ inputs.containerfile }}
          BUILD_ARGS: ${{ inputs.build-args }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          args=()
          while IFS= read -r line || [ -n "$line" ]; do
            [ -n "${line//[[:space:]]/}" ] && args+=(--build-arg "$line")
          done <<< "$BUILD_ARGS"
          docker build --pull "${args[@]}" \
            --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.version=$VERSION" \
            -f "$CONTEXT/$CONTAINERFILE" -t "$IMAGE" "$CONTEXT"

      # Runs the image under production hardening. Tested by tests/test_contract.py,
      # which runs this exact script. RUN_FLAGS is the one list of hardening flags:
      # it must match infra's app.container template (UserNS=auto has no Docker
      # equivalent, so the image's own non-root USER is checked instead).
      - name: Run the image under production hardening (container contract)
        id: contract
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          VERSION: ${{ needs.plan.outputs.version }}
          CONTEXT: ${{ inputs.context }}
          APP_JSON: ${{ inputs.app-json }}
          HEALTH_PATH: ${{ inputs.health-path }}
          MEMORY: ${{ inputs.memory }}
          CONTRACT_EXEC: ${{ inputs.contract-exec }}
          RUN_FLAGS: |
            --read-only
            --tmpfs=/tmp:rw,exec,nosuid,nodev
            --tmpfs=/var/tmp:rw,exec,nosuid,nodev
            --tmpfs=/run:rw,exec,nosuid,nodev
            --cap-drop=all
            --security-opt=no-new-privileges
            --pids-limit=2048
        run: |
          engine="${ENGINE:-docker}"
          timeout="${HEALTH_TIMEOUT:-60}"
          # Not 3000, so an app that ignores PORT fails here, not in production.
          port=18080
          probe=docker.io/library/busybox:1.37.0-musl@sha256:5624bb6777cf469b1fb50ae3f981b15d2715ee2fffaf20b9998cfb7843726835
          contract="https://github.com/ArachneDev/infra/blob/main/docs/blueprint.md#container-contract"
          fail=0
          problem() { echo "::error title=Container contract::$1"; fail=1; }
          hardening="Contract: runs under hardened defaults: read-only root, no capabilities, no-new-privileges, a memory limit."

          if [[ ! "$HEALTH_PATH" =~ ^/[A-Za-z0-9._~/-]*$ ]]; then
            echo "::error::health-path must be a path such as /healthz."; exit 1
          fi
          # A unit is required and 0 is refused: Docker and Podman read 0 as no limit, a bare number as bytes.
          if [[ ! "$MEMORY" =~ ^[1-9][0-9]*[kmg]$ ]]; then
            echo "::error::memory must be a size such as 512m or 1g."; exit 1
          fi
          # Never print the value: a caller may have pasted the secrets instead of a path.
          if [ -n "$APP_JSON" ] && [ ! -f "$CONTEXT/$APP_JSON" ]; then
            echo "::error::app-json does not name a file in $CONTEXT (the value is not printed). Fix: commit a sample with fake values there and give its path, or leave app-json empty."; exit 1
          fi
          # One mode per line, "<exec> | <health>"; each side is split on spaces, with no shell.
          modes=()
          while IFS= read -r line || [ -n "$line" ]; do
            [ -n "${line//[[:space:]]/}" ] || continue
            if [[ "$line" != *" | "* ]] || [ -z "${line%% | *}" ] || [ -z "${line#* | }" ]; then
              echo "::error::contract-exec needs one '<exec> | <health>' per line, such as 'node apps/bot/dist/main.js | node apps/bot/dist/healthcheck.js' (the value is not printed)."; exit 1
            fi
            modes+=("$line")
          done <<< "${CONTRACT_EXEC:-}"
          mapfile -t flags < <(printf '%s\n' "$RUN_FLAGS" | sed '/^[[:space:]]*$/d')
          [ "${#flags[@]}" -gt 0 ] || { echo "::error::RUN_FLAGS is empty: the contract test would run without hardening."; exit 1; }

          # Files the app repo must have, next to its Containerfile.
          if [ ! -f "$CONTEXT/.env.example" ]; then
            problem ".env.example is missing in $CONTEXT. Contract: the app lists every variable it reads, with a one-line description each, in .env.example. Fix: add .env.example with a '# description' line and a VAR=example line per variable; leave it empty if the app reads none."
          fi
          if [ ! -f "$CONTEXT/README.md" ]; then
            problem "README.md is missing in $CONTEXT. Contract: the README states the port, volumes, external dependencies and measured memory peak. Fix: add README.md with a heading for each."
          else
            missing=()
            # Whole words only: "Support" or "report-bot" is not a Port section.
            for pair in "Port:ports?" "Volumes:volumes?|persist[a-z]*" "Dependencies:dependenc(y|ies)|depends?" "Memory:memory"; do
              grep -qiE "^#+ (.*[^[:alnum:]])?(${pair#*:})([^[:alnum:]]|$)" "$CONTEXT/README.md" || missing+=("${pair%%:*}")
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              list="$(IFS=,; echo "${missing[*]}")"
              problem "README.md has no section for: ${list//,/, }. Contract: the README states the port, volumes, external dependencies and measured memory peak. Fix: add a heading for each, such as '## ${missing[0]}'. Write 'None' where nothing applies."
            fi
          fi

          # The image's own user: production adds UserNS=auto, but root inside is still refused.
          # Only a numeric UID above 0 passes: "00", or a name that /etc/passwd maps to 0, is root too.
          user="$("$engine" image inspect -f '{{.Config.User}}' "$IMAGE")"
          if [[ ! "${user%%:*}" =~ ^[1-9][0-9]*$ ]]; then
            problem "the image may run as root: USER is '${user:-unset}', not a numeric UID above 0. Contract: runs as a non-root user inside the container. Fix: add a numeric USER such as 'USER 10001:10001' at the end of the Containerfile (a name can map to UID 0), and chown only what the app must write."
          fi

          name="contract-$$-$RANDOM" net="contract-$$-$RANDOM" tmp="$(mktemp -d)"
          names=("$name")
          trap '"$engine" rm -f "${names[@]}" >/dev/null 2>&1; "$engine" network rm "$net" >/dev/null 2>&1; rm -rf "$tmp"' EXIT
          if [ -z "$APP_JSON" ]; then
            echo '{}' > "$tmp/app.json"
          else
            cp "$CONTEXT/$APP_JSON" "$tmp/app.json"
          fi
          chmod 0444 "$tmp/app.json"
          envfile=()
          [ -f "$CONTEXT/.env.example" ] && envfile=(--env-file "$CONTEXT/.env.example")

          "$engine" pull -q "$probe" >/dev/null
          "$engine" network create "$net" >/dev/null
          # Starts a container under the hardening flags: name, then an optional command instead of the image's CMD.
          start_container() {
            local n="$1"; shift
            "$engine" run -d --name "$n" --network "$net" --network-alias app "${flags[@]}" --memory="$MEMORY" \
              "${envfile[@]}" -e "PORT=$port" -e "PUBLIC_URL=https://app.example.com" \
              -v "$tmp/app.json:/run/secrets/app.json:ro,z" "$IMAGE" "$@" >/dev/null
          }
          echo "Running $IMAGE with ${flags[*]} --memory=$MEMORY, PORT=$port and /run/secrets/app.json"
          if ! start_container "$name"; then
            problem "the container did not start. $hardening Fix: see the error above."; exit 1
          fi

          # Production reaches the app over its network, never on loopback.
          url="http://app:$port$HEALTH_PATH" ok=0 body=""
          deadline=$((SECONDS + timeout))
          while [ "$SECONDS" -lt "$deadline" ]; do
            [ "$("$engine" inspect -f '{{.State.Status}}' "$name")" = running ] || break
            if body="$("$engine" run --rm --network "$net" "$probe" wget -q -T 3 -O - "$url" 2>/dev/null)"; then ok=1; break; fi
            sleep 2
          done

          if [ "$ok" = 1 ]; then
            # A whole token: v1.2.30 or v1.2.3-rc1 is not v1.2.3.
            if ! grep -oE '[[:alnum:]._+-]+' <<< "$body" | grep -qxF -- "$VERSION"; then
              problem "GET $HEALTH_PATH answered but did not include the build version $VERSION. Contract: a health endpoint such as /healthz that returns the build version. Fix: return the VERSION build argument in the body, for example 'ARG VERSION' then 'ENV VERSION=\$VERSION' in the Containerfile."
            fi
          else
            state="$("$engine" inspect -f '{{.State.Status}} {{.State.ExitCode}} {{.State.OOMKilled}}' "$name")"
            logs="$("$engine" logs --tail 40 "$name" 2>&1 || true)"
            echo "::group::Last 40 log lines"; printf '%s\n' "$logs"; echo "::endgroup::"
            read -r status code oom <<< "$state"
            if grep -qiE 'read-only file system|EROFS' <<< "$logs"; then
              problem "the app wrote to the read-only root filesystem. $hardening Fix: write temporary files under /tmp, and list paths that must persist in the README so the stack mounts them as volumes."
            elif [ "$oom" = true ]; then
              problem "the app ran out of memory under --memory=$MEMORY. $hardening Fix: lower the app's memory use, or set the memory input to the measured peak plus 25 to 50 percent."
            elif grep -qiE 'permission denied|operation not permitted|EACCES|EPERM' <<< "$logs"; then
              problem "the app hit a permission error (see the log above). Contract: runs as a non-root user with no capabilities. Fix: listen on a port above 1024, don't chown or switch users at start, and make files the app reads readable by the image's USER."
            elif [ "$status" = running ]; then
              # 127.0.0.11 is Docker's embedded DNS on user networks, not the app.
              listening="$("$engine" run --rm --network "container:$name" "$probe" netstat -ltn 2>/dev/null | awk '$NF == "LISTEN" {print $4}' | grep -v '^127\.0\.0\.11:' || true)"
              ports="$(sed 's/.*://' <<< "$listening" | sort -un | paste -sd, -)"
              if [ -z "$ports" ]; then
                problem "nothing listened on any port within ${timeout}s. Contract: listens on the port given in PORT, default 3000. Fix: start the server on PORT; if start-up is slow, make it faster or report it to the platform owner."
              elif ! grep -qE "[:.]$port\$" <<< "$listening"; then
                problem "the app listens on port ${ports//,/, }, not on PORT=$port. Contract: listens on the port given in PORT, default 3000. Fix: read the port from the PORT environment variable instead of hardcoding it."
              elif ! grep -qvE "^(127\.|::1:|::ffff:127\.)" <<< "$(grep -E "[:.]$port\$" <<< "$listening")"; then
                problem "the app listens on PORT only on loopback, so nothing outside the container reaches it. Contract: listens on the port given in PORT. Fix: listen on 0.0.0.0 (all interfaces), not 127.0.0.1 or localhost."
              else
                problem "GET $HEALTH_PATH on PORT=$port did not answer 2xx within ${timeout}s. Contract: a health endpoint such as /healthz that returns the build version. Fix: serve $HEALTH_PATH with status 200, or set the health-path input."
              fi
            else
              problem "the container exited with code $code before $HEALTH_PATH answered (see the log above). $hardening The app also reads its secrets from /run/secrets/app.json. Fix: make it start under these flags; to test with secrets, commit a fake-values sample and name it in the app-json input."
            fi
          fi

          # Each extra mode runs the same way, with its own command. It passes when its health command
          # exits 0 and prints the build version, as the default mode's health-path must.
          i=0
          for mode in "${modes[@]}"; do
            i=$((i + 1))
            mexec="${mode%% | *}" mhealth="${mode#* | }" mname="$name-$i"
            read -ra mcmd <<< "$mexec"; read -ra mhc <<< "$mhealth"
            names+=("$mname")
            echo "Running mode '$mexec' with the same flags; health command: $mhealth"
            if ! start_container "$mname" "${mcmd[@]}"; then
              problem "mode '$mexec': the container did not start. $hardening Fix: see the error above, and check the contract-exec command exists in the image."; continue
            fi
            ok=0 body="" deadline=$((SECONDS + timeout))
            while [ "$SECONDS" -lt "$deadline" ]; do
              [ "$("$engine" inspect -f '{{.State.Status}}' "$mname")" = running ] || break
              if body="$("$engine" exec "$mname" "${mhc[@]}" 2>&1)"; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" = 1 ]; then
              if ! grep -oE '[[:alnum:]._+-]+' <<< "$body" | grep -qxF -- "$VERSION"; then
                problem "mode '$mexec': the health command '$mhealth' passed but its output did not include the build version $VERSION. Contract: a health check that returns the build version. Fix: make the health command print the VERSION build argument, for example 'ENV VERSION=\$VERSION' in the Containerfile."
              fi
            else
              read -r status code oom <<< "$("$engine" inspect -f '{{.State.Status}} {{.State.ExitCode}} {{.State.OOMKilled}}' "$mname")"
              logs="$("$engine" logs --tail 40 "$mname" 2>&1 || true)"
              echo "::group::Last 40 log lines of mode '$mexec'"; printf '%s\n' "$logs"; echo "::endgroup::"
              if [ "$status" = running ]; then
                problem "mode '$mexec': the health command '$mhealth' did not exit 0 within ${timeout}s. Contract: a health check that returns the build version. Fix: make the health command succeed once the mode is up, or correct the contract-exec entry. Its last output: $(tail -c 300 <<< "$body" | tr '\n' ' ')"
              elif [ "$oom" = true ]; then
                problem "mode '$mexec': ran out of memory under --memory=$MEMORY. $hardening Fix: lower its memory use, or set the memory input to the measured peak of the largest mode plus 25 to 50 percent."
              else
                problem "mode '$mexec': the container exited with code $code before its health command passed (see the log above). $hardening Fix: make the mode start and keep running under these flags; the app reads its secrets from /run/secrets/app.json."
              fi
            fi
          done

          if [ "$fail" = 0 ]; then
            echo "$IMAGE meets the container contract: $contract"
          else
            echo "The container contract: $contract"
          fi
          exit "$fail"

      - name: Fail on critical CVEs that have a fix
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          IGNORE_FILE: ${{ inputs.trivy-ignore }}
        run: |
          ignore=()
          [ -f "$IGNORE_FILE" ] && ignore=(--ignorefile "$IGNORE_FILE")
          trivy image --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 "${ignore[@]}" "$IMAGE"

      # Tested by tests/test_push.py, which runs this exact script.
      - name: Push to ghcr.io (version tags and staging builds)
        id: push
        if: needs.plan.outputs.publish == 'true'
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          VERSION: ${{ needs.plan.outputs.version }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          err="$(mktemp)"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -f "$err"' EXIT
          # A published tag never moves. Read it first; if the read fails for any
          # reason except "no such tag", push nothing.
          if existing="$(skopeo inspect --authfile "$HOME/.docker/config.json" --no-tags --format '{{.Digest}}' "docker://$IMAGE" 2>"$err")"; then
            if [[ "$VERSION" == sha-* ]]; then
              # A rerun of the same commit on staging: keep the image already published.
              echo "$IMAGE is already published at $existing for this commit; keeping it."
              echo "digest=$existing" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=Version already published::$IMAGE is already published at $existing, so this run pushed nothing. Version tags never move. Fix: to release again, push a new version tag; to move :prod to this version, run the workflow with the version input."
            exit 1
          elif ! grep -qiE 'manifest unknown|name unknown|not found|404' "$err"; then
            cat "$err" >&2
            echo "::error::could not check whether $IMAGE is already published, so nothing was pushed. Fix: run the job again."
            exit 1
          fi
          docker push "$IMAGE"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE at ${digest#*@}"

  # Moves the channel tag to the tested digest, then checks the release came up
  # and moves the tag back if it did not (ADR-006, Phase B). The `production`
  # Environment's required reviewer is the approval; `staging` has none.
  promote:
    needs: [plan, build]
    # A re-promote skips the build; a failed or cancelled build never promotes.
    if: ${{ !cancelled() && needs.plan.outputs.channel != '' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      packages: write
    environment:
      name: ${{ needs.plan.outputs.channel }}
      # The deployment history shows this link, so it names the version.
      url: https://github.com/orgs/${{ github.repository_owner }}/packages/container/package/${{ needs.plan.outputs.app }}?tag=${{ needs.plan.outputs.version }}
    # One promotion per app and channel at a time. Not one group for both
    # channels: a staging push would cancel a production run waiting for approval.
    concurrency:
      group: promote-${{ needs.plan.outputs.app }}-${{ needs.plan.outputs.channel }}
      cancel-in-progress: false
    steps:
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          auth="$RUNNER_TEMP/registry-auth.json"
          printf '%s' "$TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin --authfile "$auth"
          echo "REGISTRY_AUTH_FILE=$auth" >> "$GITHUB_ENV"

      # Tested by tests/test_promote.py, which runs this exact script against a
      # stub registry and a stub health server, and by CI's registry job against
      # a real registry. INSECURE_REGISTRY and HEALTH_INTERVAL are for those tests.
      - name: Move the channel tag, verify, move it back on failure
        id: promote
        env:
          IMAGE_REPO: ${{ needs.plan.outputs.repo }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          # The tested digest from the build; empty on a re-promote, which reads the version tag.
          DIGEST: ${{ needs.build.outputs.digest }}
          PRODUCTION_URL: ${{ inputs.production-url }}
          STAGING_URL: ${{ inputs.staging-url }}
          WINDOW: ${{ inputs.verify-window }}
          FAILURES: ${{ inputs.verify-failures }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          tag=staging HEALTH_URL="$STAGING_URL"
          [ "$CHANNEL" = production ] && { tag=prod; HEALTH_URL="$PRODUCTION_URL"; }
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          inspect_flags=() copy_flags=()
          if [ "${INSECURE_REGISTRY:-}" = true ]; then
            inspect_flags=(--tls-verify=false) copy_flags=(--src-tls-verify=false --dest-tls-verify=false)
          fi
          summary() { [ -n "${GITHUB_STEP_SUMMARY:-}" ] && printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; return 0; }

          # The digest a name points at, exactly as the registry serves it: the
          # index digest for an index, the image digest for an image. Exit 3 when
          # the name does not exist; any other failure exits 1 and prints why.
          digest_of() {
            local out
            if out="$(skopeo inspect "${inspect_flags[@]}" --no-tags --format '{{.Digest}}' "docker://$IMAGE_REPO$1" 2>"$tmp/err")"; then
              printf '%s\n' "$out"; return 0
            fi
            if grep -qiE 'manifest unknown|name unknown|not found|404' "$tmp/err"; then return 3; fi
            cat "$tmp/err" >&2; return 1
          }
          kind_of() { # image or index
            if skopeo inspect "${inspect_flags[@]}" --raw "docker://$IMAGE_REPO@$1" 2>/dev/null | grep -q '"manifests"'; then echo index; else echo image; fi
          }
          # Copy by digest with no rebuild. --all copies every platform of an index;
          # --preserve-digests fails rather than write a manifest with another digest.
          move_to() {
            skopeo copy "${copy_flags[@]}" --all --preserve-digests "docker://$IMAGE_REPO@$1" "docker://$IMAGE_REPO:$tag" >/dev/null \
              && [ "$(digest_of ":$tag")" = "$1" ]
          }

          if [[ ! "$WINDOW" =~ ^[1-9][0-9]*$ ]] || [ "$WINDOW" -gt 3000 ]; then
            echo "::error::verify-window must be a number of seconds from 1 to 3000."; exit 1
          fi
          if [[ ! "$FAILURES" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::verify-failures must be a number above 0."; exit 1
          fi

          # 1. The digest to move to: the tested build, or the version tag's image.
          target="$DIGEST"
          if [ -z "$target" ]; then
            rc=0; target="$(digest_of ":$VERSION")" || rc=$?
            if [ "$rc" = 3 ]; then echo "::error::$IMAGE_REPO:$VERSION does not exist, so there is nothing to promote. Fix: give a version that was published."; exit 1; fi
            [ "$rc" = 0 ] || { echo "::error::could not read $IMAGE_REPO:$VERSION; nothing moved."; exit 1; }
          fi
          if [[ ! "$target" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "::error::not a digest: ${target:0:80}"; exit 1; fi

          # 2. Record what the tag points at now, to move back to.
          rc=0; prev="$(digest_of ":$tag")" || rc=$?
          if [ "$rc" = 3 ]; then prev=""
          elif [ "$rc" != 0 ]; then echo "::error::could not read :$tag; nothing moved. Fix: run the job again."; exit 1; fi
          if [ -n "$prev" ]; then echo "Recorded :$tag at $prev ($(kind_of "$prev"))"; else echo "Recorded: :$tag does not exist yet, so there is nothing to move back to."; fi
          echo "Target $VERSION at $target ($(kind_of "$target"))"

          revert() { # reason
            local reason="$1"
            if [ -z "$prev" ]; then
              echo "::error title=Release failed::$reason. :$tag had no earlier digest, so it was left on $VERSION."
              summary "Release of $VERSION failed: $reason. :$tag was left on it (no earlier digest)."
            elif [ "$prev" = "$target" ]; then
              echo "::error title=Release failed::$reason. :$tag already pointed at this digest, so there is nothing to move back to."
              summary "Release of $VERSION failed: $reason."
            elif move_to "$prev"; then
              echo "::error title=Release moved back::$reason. :$tag is back at $prev, the digest it replaced."
              summary "Release of $VERSION moved back: $reason. :$tag is at $prev again."
            else
              echo "::error title=Move back failed::$reason. Moving :$tag back to $prev also failed. Fix: run skopeo copy by hand, or release the previous version again."
              summary "Release of $VERSION failed: $reason. Moving :$tag back to $prev failed too."
            fi
            exit 1
          }

          # 3. Move the tag.
          if [ "$prev" = "$target" ]; then
            echo ":$tag already points at $target; nothing to move."
          elif ! move_to "$target"; then
            # A failed copy leaves the tag where it was; find out before deciding.
            now="$(digest_of ":$tag" || true)"
            if [ "$now" = "$prev" ]; then echo "::error::the copy to :$tag failed; the tag did not move."; exit 1; fi
            revert "the copy to :$tag did not end on $target"
          else
            echo ":$tag now points at $target"
          fi

          # 4. Verify. An app with no port has no URL: the tag moved and that is all.
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice::No health URL for this channel, so the release was not verified."
            summary "$VERSION moved to :$tag at $target. Not verified: no health URL."
            exit 0
          fi
          hdr=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            # In a file, so the values never reach a command line or the log.
            ( umask 077; printf 'CF-Access-Client-Id: %s\nCF-Access-Client-Secret: %s\n' "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > "$tmp/headers" )
            hdr=(-H "@$tmp/headers")
          fi
          interval="${HEALTH_INTERVAL:-15}" allowance=$((WINDOW / 2))
          start=$SECONDS seen=0 bad=0 polls=0 reason=""
          echo "Polling $HEALTH_URL for $VERSION every ${interval}s for ${WINDOW}s; failures count after ${allowance}s, or once it has shown; $FAILURES in a row move :$tag back."
          while :; do
            elapsed=$((SECONDS - start)); polls=$((polls + 1))
            code="$(curl -sS -m 5 "${hdr[@]}" -o "$tmp/body" -w '%{http_code}' "$HEALTH_URL" 2>"$tmp/curl-err")" || code=000
            if [[ "$code" =~ ^2 ]] && head -c 4096 "$tmp/body" | grep -oE '[[:alnum:]._+-]+' | grep -qxF -- "$VERSION"; then
              seen=1 bad=0
            else
              if [ "$code" = 000 ]; then why="no answer ($(head -c 80 "$tmp/curl-err" | tr -cd '[:print:]'))"
              elif [[ "$code" =~ ^2 ]]; then why="HTTP $code without $VERSION in the body (got: $(head -c 60 "$tmp/body" | tr -cd '[:print:]'))"
              else why="HTTP $code"; [[ "$code" =~ ^30 ]] && why="$why, a redirect: behind Cloudflare Access? Set the CF_ACCESS secrets"; fi
              if [ "$seen" = 1 ] || [ "$elapsed" -ge "$allowance" ]; then
                bad=$((bad + 1)) reason="$why"
                [ "$bad" -ge "$FAILURES" ] && revert "$HEALTH_URL failed $bad polls in a row ($why); the new version $VERSION $([ "$seen" = 1 ] && echo 'had shown and then stopped' || echo 'never showed')"
              fi
            fi
            [ "$elapsed" -ge "$WINDOW" ] && break
            sleep "$interval"
          done
          [ "$seen" = 1 ] || revert "$HEALTH_URL never reported $VERSION in ${WINDOW}s (last: ${reason:-no failing poll after the allowance})"
          echo "$VERSION held on $HEALTH_URL for ${WINDOW}s; :$tag is at $target."
          summary "$VERSION is live on :$tag at $target and held for ${WINDOW}s."
