# The shared build: gitleaks on the repo, a build-args check, build the
# Containerfile, the contract test, Trivy scan, and on a tag push
# ghcr.io/<owner>/<app>:<tag>.
# Apps call it from a short CI file; see README.md. Changing it: AGENTS.md.
name: build

on:
  workflow_call:
    inputs:
      app:
        description: Image name under ghcr.io/<owner>. Default the repo name, lowercased.
        type: string
        default: ""
      context:
        description: Build context, relative to the repo root.
        type: string
        default: .
      containerfile:
        description: Path to the Containerfile, relative to the context.
        type: string
        default: Containerfile
      build-args:
        description: One KEY=VALUE per line. Never secrets; a secret-shaped name or value fails the build.
        type: string
        default: ""
      trivy-ignore:
        description: Trivy ignore file, relative to the repo root. One CVE ID per line, with a comment saying why.
        type: string
        default: .trivyignore
      app-json:
        description: Sample /run/secrets/app.json for the contract test, relative to the context. Fake values only; it is committed. Default an empty object.
        type: string
        default: ""
      health-path:
        description: The path the contract test and uptime checks call. It must answer 2xx with the build version.
        type: string
        default: /healthz
      memory:
        description: Memory limit for the contract test, as in production (--memory). Set it to the app's measured peak plus 25 to 50 percent.
        type: string
        default: 512m
    outputs:
      image:
        description: The image reference built, ghcr.io/<owner>/<app>:<version>.
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: The pushed digest (sha256:...). Empty when nothing was pushed.
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      # Keep the gitleaks pin equal to tools/check-image/Containerfile.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks and Trivy, verified by sha256
        run: |
          bin="$RUNNER_TEMP/bin" && mkdir -p "$bin" && cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" gitleaks.tgz "$TRIVY_SHA256" trivy.tgz | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$bin" gitleaks
          tar -xzf trivy.tgz -C "$bin" trivy
          echo "$bin" >> "$GITHUB_PATH"

      - name: Compute image name and version
        id: vars
        env:
          APP: ${{ inputs.app }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          app="${APP:-$REPO_NAME}"
          if [ "$REF_TYPE" = tag ]; then
            # Only vX.Y.Z (optionally -prerelease) publishes. Tags such as prod and
            # staging are moved by the release flow and must never be pushed here.
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag ${REF_NAME:0:60} is not a version such as v1.4.0. Only version tags publish."; exit 1
            fi
            version="$REF_NAME" publish=true
          else
            version="sha-${SHA:0:12}" publish=false
          fi
          image="ghcr.io/${OWNER,,}/${app,,}:${version}"
          echo "Image: $image (publish: $publish)"
          { echo "image=$image"; echo "version=$version"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"

      # Tested by tests/test_build_args.py, which runs this exact script.
      - name: Refuse secret-shaped build arguments
        id: build-args
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          # Our config only: a .gitleaks.toml, .gitleaksignore or gitleaks:allow
          # comment in the caller's repo must not silence a finding.
          gl="$(mktemp -d)" && mkdir "$gl/no-ignore"
          printf '[extend]\nuseDefault = true\n' > "$gl/config.toml"
          fail=0
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "${line//[[:space:]]/}" ] && continue
            if [[ "$line" != *=* ]]; then
              echo "::error::build-args line is not KEY=VALUE: ${line:0:40}"; fail=1; continue
            fi
            name="${line%%=*}"; upper="${name^^}"; segs="_${upper//-/_}_"
            if [[ "$upper" =~ SECRET|TOKEN|PASSWORD|PASSWD|CREDENTIAL|APIKEY|PRIVATE ]] \
              || [[ "$segs" =~ _(KEY|PASS|PWD|AUTH|CERT|COOKIE|SALT|DSN|SESSION)S?_ ]]; then
              echo "::error::build-args name $name looks secret. Pass secrets at run time, never at build time."; fail=1
            fi
          done <<< "$BUILD_ARGS"
          if [ -n "$BUILD_ARGS" ] && ! printf '%s\n' "$BUILD_ARGS" | gitleaks stdin --no-banner --redact --log-level error \
              --config "$gl/config.toml" --gitleaks-ignore-path "$gl/no-ignore" --ignore-gitleaks-allow; then
            echo "::error::gitleaks found a secret-shaped value in build-args."; fail=1
          fi
          exit "$fail"

      - name: Scan the repo history for secrets
        id: history
        # Every commit reachable from HEAD (what is built), not other branches.
        # Our config only, as in the build-args step. gitleaks always reads a
        # .gitleaksignore at the root it scans, so scan the git dir, not the tree.
        run: |
          gl="$(mktemp -d)" && mkdir "$gl/no-ignore"
          printf '[extend]\nuseDefault = true\n' > "$gl/config.toml"
          gitleaks git --no-banner --redact --log-opts="--full-history HEAD" \
            --config "$gl/config.toml" --gitleaks-ignore-path "$gl/no-ignore" --ignore-gitleaks-allow \
            "$(git rev-parse --absolute-git-dir)"

      - name: Build the image
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          VERSION: ${{ steps.vars.outputs.version }}
          CONTEXT: ${{ inputs.context }}
          CONTAINERFILE: ${{ inputs.containerfile }}
          BUILD_ARGS: ${{ inputs.build-args }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          args=()
          while IFS= read -r line || [ -n "$line" ]; do
            [ -n "${line//[[:space:]]/}" ] && args+=(--build-arg "$line")
          done <<< "$BUILD_ARGS"
          docker build --pull "${args[@]}" \
            --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.version=$VERSION" \
            -f "$CONTEXT/$CONTAINERFILE" -t "$IMAGE" "$CONTEXT"

      # Runs the image under production hardening. Tested by tests/test_contract.py,
      # which runs this exact script. RUN_FLAGS is the one list of hardening flags:
      # it must match infra's app.container template (UserNS=auto has no Docker
      # equivalent, so the image's own non-root USER is checked instead).
      - name: Run the image under production hardening (container contract)
        id: contract
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          VERSION: ${{ steps.vars.outputs.version }}
          CONTEXT: ${{ inputs.context }}
          APP_JSON: ${{ inputs.app-json }}
          HEALTH_PATH: ${{ inputs.health-path }}
          MEMORY: ${{ inputs.memory }}
          RUN_FLAGS: |
            --read-only
            --tmpfs=/tmp:rw,exec,nosuid,nodev
            --tmpfs=/var/tmp:rw,exec,nosuid,nodev
            --tmpfs=/run:rw,exec,nosuid,nodev
            --cap-drop=all
            --security-opt=no-new-privileges
            --pids-limit=2048
        run: |
          engine="${ENGINE:-docker}"
          timeout="${HEALTH_TIMEOUT:-60}"
          # Not 3000, so an app that ignores PORT fails here, not in production.
          port=18080
          probe=docker.io/library/busybox:1.37.0-musl@sha256:5624bb6777cf469b1fb50ae3f981b15d2715ee2fffaf20b9998cfb7843726835
          contract="https://github.com/ArachneDev/infra/blob/main/docs/blueprint.md#container-contract"
          fail=0
          problem() { echo "::error title=Container contract::$1"; fail=1; }
          hardening="Contract: runs under hardened defaults: read-only root, no capabilities, no-new-privileges, a memory limit."

          if [[ ! "$HEALTH_PATH" =~ ^/[A-Za-z0-9._~/-]*$ ]]; then
            echo "::error::health-path must be a path such as /healthz."; exit 1
          fi
          # A unit is required and 0 is refused: Docker and Podman read 0 as no limit, a bare number as bytes.
          if [[ ! "$MEMORY" =~ ^[1-9][0-9]*[kmg]$ ]]; then
            echo "::error::memory must be a size such as 512m or 1g."; exit 1
          fi
          # Never print the value: a caller may have pasted the secrets instead of a path.
          if [ -n "$APP_JSON" ] && [ ! -f "$CONTEXT/$APP_JSON" ]; then
            echo "::error::app-json does not name a file in $CONTEXT (the value is not printed). Fix: commit a sample with fake values there and give its path, or leave app-json empty."; exit 1
          fi
          mapfile -t flags < <(printf '%s\n' "$RUN_FLAGS" | sed '/^[[:space:]]*$/d')
          [ "${#flags[@]}" -gt 0 ] || { echo "::error::RUN_FLAGS is empty: the contract test would run without hardening."; exit 1; }

          # Files the app repo must have, next to its Containerfile.
          if [ ! -f "$CONTEXT/.env.example" ]; then
            problem ".env.example is missing in $CONTEXT. Contract: the app lists every variable it reads, with a one-line description each, in .env.example. Fix: add .env.example with a '# description' line and a VAR=example line per variable; leave it empty if the app reads none."
          fi
          if [ ! -f "$CONTEXT/README.md" ]; then
            problem "README.md is missing in $CONTEXT. Contract: the README states the port, volumes, external dependencies and measured memory peak. Fix: add README.md with a heading for each."
          else
            missing=()
            # Whole words only: "Support" or "report-bot" is not a Port section.
            for pair in "Port:ports?" "Volumes:volumes?|persist[a-z]*" "Dependencies:dependenc(y|ies)|depends?" "Memory:memory"; do
              grep -qiE "^#+ (.*[^[:alnum:]])?(${pair#*:})([^[:alnum:]]|$)" "$CONTEXT/README.md" || missing+=("${pair%%:*}")
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              list="$(IFS=,; echo "${missing[*]}")"
              problem "README.md has no section for: ${list//,/, }. Contract: the README states the port, volumes, external dependencies and measured memory peak. Fix: add a heading for each, such as '## ${missing[0]}'. Write 'None' where nothing applies."
            fi
          fi

          # The image's own user: production adds UserNS=auto, but root inside is still refused.
          # Only a numeric UID above 0 passes: "00", or a name that /etc/passwd maps to 0, is root too.
          user="$("$engine" image inspect -f '{{.Config.User}}' "$IMAGE")"
          if [[ ! "${user%%:*}" =~ ^[1-9][0-9]*$ ]]; then
            problem "the image may run as root: USER is '${user:-unset}', not a numeric UID above 0. Contract: runs as a non-root user inside the container. Fix: add a numeric USER such as 'USER 10001:10001' at the end of the Containerfile (a name can map to UID 0), and chown only what the app must write."
          fi

          name="contract-$$-$RANDOM" net="contract-$$-$RANDOM" tmp="$(mktemp -d)"
          trap '"$engine" rm -f "$name" >/dev/null 2>&1; "$engine" network rm "$net" >/dev/null 2>&1; rm -rf "$tmp"' EXIT
          if [ -z "$APP_JSON" ]; then
            echo '{}' > "$tmp/app.json"
          else
            cp "$CONTEXT/$APP_JSON" "$tmp/app.json"
          fi
          chmod 0444 "$tmp/app.json"
          envfile=()
          [ -f "$CONTEXT/.env.example" ] && envfile=(--env-file "$CONTEXT/.env.example")

          "$engine" pull -q "$probe" >/dev/null
          "$engine" network create "$net" >/dev/null
          echo "Running $IMAGE with ${flags[*]} --memory=$MEMORY, PORT=$port and /run/secrets/app.json"
          if ! "$engine" run -d --name "$name" --network "$net" --network-alias app "${flags[@]}" --memory="$MEMORY" \
              "${envfile[@]}" -e "PORT=$port" -e "PUBLIC_URL=https://app.example.com" \
              -v "$tmp/app.json:/run/secrets/app.json:ro,z" "$IMAGE" >/dev/null; then
            problem "the container did not start. $hardening Fix: see the error above."; exit 1
          fi

          # Production reaches the app over its network, never on loopback.
          url="http://app:$port$HEALTH_PATH" ok=0 body=""
          deadline=$((SECONDS + timeout))
          while [ "$SECONDS" -lt "$deadline" ]; do
            [ "$("$engine" inspect -f '{{.State.Status}}' "$name")" = running ] || break
            if body="$("$engine" run --rm --network "$net" "$probe" wget -q -T 3 -O - "$url" 2>/dev/null)"; then ok=1; break; fi
            sleep 2
          done

          if [ "$ok" = 1 ]; then
            # A whole token: v1.2.30 or v1.2.3-rc1 is not v1.2.3.
            if ! grep -oE '[[:alnum:]._+-]+' <<< "$body" | grep -qxF -- "$VERSION"; then
              problem "GET $HEALTH_PATH answered but did not include the build version $VERSION. Contract: a health endpoint such as /healthz that returns the build version. Fix: return the VERSION build argument in the body, for example 'ARG VERSION' then 'ENV VERSION=\$VERSION' in the Containerfile."
            fi
          else
            state="$("$engine" inspect -f '{{.State.Status}} {{.State.ExitCode}} {{.State.OOMKilled}}' "$name")"
            logs="$("$engine" logs --tail 40 "$name" 2>&1 || true)"
            echo "::group::Last 40 log lines"; printf '%s\n' "$logs"; echo "::endgroup::"
            read -r status code oom <<< "$state"
            if grep -qiE 'read-only file system|EROFS' <<< "$logs"; then
              problem "the app wrote to the read-only root filesystem. $hardening Fix: write temporary files under /tmp, and list paths that must persist in the README so the stack mounts them as volumes."
            elif [ "$oom" = true ]; then
              problem "the app ran out of memory under --memory=$MEMORY. $hardening Fix: lower the app's memory use, or set the memory input to the measured peak plus 25 to 50 percent."
            elif grep -qiE 'permission denied|operation not permitted|EACCES|EPERM' <<< "$logs"; then
              problem "the app hit a permission error (see the log above). Contract: runs as a non-root user with no capabilities. Fix: listen on a port above 1024, don't chown or switch users at start, and make files the app reads readable by the image's USER."
            elif [ "$status" = running ]; then
              # 127.0.0.11 is Docker's embedded DNS on user networks, not the app.
              listening="$("$engine" run --rm --network "container:$name" "$probe" netstat -ltn 2>/dev/null | awk '$NF == "LISTEN" {print $4}' | grep -v '^127\.0\.0\.11:' || true)"
              ports="$(sed 's/.*://' <<< "$listening" | sort -un | paste -sd, -)"
              if [ -z "$ports" ]; then
                problem "nothing listened on any port within ${timeout}s. Contract: listens on the port given in PORT, default 3000. Fix: start the server on PORT; if start-up is slow, make it faster or report it to the platform owner."
              elif ! grep -qE "[:.]$port\$" <<< "$listening"; then
                problem "the app listens on port ${ports//,/, }, not on PORT=$port. Contract: listens on the port given in PORT, default 3000. Fix: read the port from the PORT environment variable instead of hardcoding it."
              elif ! grep -qvE "^(127\.|::1:|::ffff:127\.)" <<< "$(grep -E "[:.]$port\$" <<< "$listening")"; then
                problem "the app listens on PORT only on loopback, so nothing outside the container reaches it. Contract: listens on the port given in PORT. Fix: listen on 0.0.0.0 (all interfaces), not 127.0.0.1 or localhost."
              else
                problem "GET $HEALTH_PATH on PORT=$port did not answer 2xx within ${timeout}s. Contract: a health endpoint such as /healthz that returns the build version. Fix: serve $HEALTH_PATH with status 200, or set the health-path input."
              fi
            else
              problem "the container exited with code $code before $HEALTH_PATH answered (see the log above). $hardening The app also reads its secrets from /run/secrets/app.json. Fix: make it start under these flags; to test with secrets, commit a fake-values sample and name it in the app-json input."
            fi
          fi

          if [ "$fail" = 0 ]; then
            echo "$IMAGE meets the container contract: $contract"
          else
            echo "The container contract: $contract"
          fi
          exit "$fail"

      - name: Fail on critical CVEs that have a fix
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          IGNORE_FILE: ${{ inputs.trivy-ignore }}
        run: |
          ignore=()
          [ -f "$IGNORE_FILE" ] && ignore=(--ignorefile "$IGNORE_FILE")
          trivy image --no-progress --severity CRITICAL --ignore-unfixed --exit-code 1 "${ignore[@]}" "$IMAGE"

      - name: Push to ghcr.io (tag pushes only)
        id: push
        if: steps.vars.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE at ${digest#*@}"
          docker logout ghcr.io
